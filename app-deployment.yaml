apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-node-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-node-app
  template:
    metadata:
      labels:
        app: sample-node-app
    spec:
      containers:
      - name: node-app
        image: ku12nia/jenkins-slave-alpine:17
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sample-node-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: sample-node-app
  ports:
    - port: 80
      targetPort: 3000
