apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-app
  template:
    metadata:
      labels:
        app: prod-app
    spec:
      containers:
      - name: prod-app
        image: ku12nia/nodejs:11-prod
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: prod-app-service
  namespace: apps
spec:
  type: NodePort
  selector:
    app: prod-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30000
