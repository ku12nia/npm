apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-app.fullname" . }}-service
  labels:
    app: {{ include "my-app.name" . }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
  selector:
    app: {{ include "my-app.name" . }}