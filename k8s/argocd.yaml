---
# ==========================================
# 1. DEV ENVIRONMENT APPLICATION
# ==========================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-app-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/ku12nia/npm.git'
    targetRevision: dev
    path: k8s/helm-chart
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

