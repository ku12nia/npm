services:
# --- JENKINS ---
  jenkins:
    image: npm-jenkins
    build: 
      context: .
      dockerfile: Dockerfile.win
    container_name: jenkins-local
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/var/jenkins_home/.kube:ro
      - ${LOCAL_PROJECT_PATH}:${WORKSPACE_DIR}
    environment:
      - GIT_SSL_NO_VERIFY=true
      - LOCAL_SRC_PATH=${WORKSPACE_DIR}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - devops-network

  # --- POSTGRESQL ---
  postgres:
    image: postgres:17-alpine
    container_name: postgres-17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - devops-network

  # --- MINIO ---
  minio:
    image: quay.io/minio/aistor/minio
    container_name: minio-local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - devops-network

  # --- NEXUS ---
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081" # Port UI default Nexus dipindah ke 8081
      - "8082:8083" # NPM Proxy Access
      - "8084:8084" # Akses Docker Hosted
    volumes:
      - nexus_data:/nexus-data
    networks:
      - devops-network

volumes:
  jenkins_home:
    name: npm_jenkins_home
  pgdata: 
    name: npm_pgdata
  minio_data:
    name: npm_minio_data
  nexus_data:
    name: nexus_data

networks:
  devops-network:
    driver: bridge