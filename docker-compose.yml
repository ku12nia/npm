services:
# --- JENKINS ---
  jenkins:
    build: 
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-local
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/var/jenkins_home/.kube:ro
      - ${LOCAL_PROJECT_PATH}:${WORKSPACE_DIR}
    environment:
      - GIT_SSL_NO_VERIFY=true
      - LOCAL_SRC_PATH=${WORKSPACE_DIR}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - devops-network

  # --- POSTGRESQL ---
  postgres:
    image: postgres:17-alpine
    container_name: postgres-17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - npm_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - devops-network

  # --- MINIO ---
  minio:
    image: quay.io/minio/aistor/minio
    container_name: minio-local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - devops-network

volumes:
  jenkins_home:
  npm_pgdata:
  minio_data:

networks:
  devops-network:
    driver: bridge