services:
# --- JENKINS ---
  jenkins:
    image: npm-jenkins
    build: 
      context: .
      dockerfile: Dockerfile.win
    container_name: jenkins-local
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERPROFILE}/.kube:/var/jenkins_home/.kube:ro
      - ${LOCAL_PROJECT_PATH}:${WORKSPACE_DIR}
    environment:
      - GIT_SSL_NO_VERIFY=true
      - LOCAL_SRC_PATH=${WORKSPACE_DIR}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "argocd.local:host-gateway"
      - "grafana.local:host-gateway"
    restart: unless-stopped
    networks:
      - devops-network

  # --- POSTGRESQL ---
  postgres:
    image: postgres:17-alpine
    container_name: postgres-17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - devops-network

  # --- MINIO ---
  minio:
    image: quay.io/minio/aistor/minio
    container_name: minio-local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - devops-network

# --- SONARQUBE COMMUNITY ---
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-local
    restart: unless-stopped
    ports:
      - "9002:9000" # Port UI SonarQube
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar # Menggunakan DB Postgres yang sama
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - postgres
    networks:
      - devops-network

  # --- NEXUS ---
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8082:8081" # Port UI default Nexus
      - "8083:8083" # NPM Proxy Access
      - "8084:8084" # Akses Docker Hosted
    volumes:
      - nexus_data:/nexus-data
    networks:
      - devops-network
  
  # --- SMEE CLIENT (GITHUB WEBHOOK FORWARDER) ---
  smee:
    image: node:22-alpine
    container_name: smee-client
    command: npx --yes smee-client -u https://smee.io/SXA0wgagJl6hvkFk -t http://jenkins:8080/github-webhook/
    restart: unless-stopped
    depends_on:
      - jenkins
    networks:
      - devops-network

volumes:
  jenkins_home:
    name: npm_jenkins_home
  pgdata: 
    name: npm_pgdata
  minio_data:
    name: npm_minio_data
  nexus_data:
    name: nexus_data
  sonarqube_data:
    name: npm_sonarqube_data
  sonarqube_logs:
    name: npm_sonarqube_logs
  sonarqube_extensions:
    name: npm_sonarqube_extensions

networks:
  devops-network:
    driver: bridge